[project]
name = "reflectool"
version = "0.1.0"
description = "Reflection-group matcher: sorts students into small weekly discussion groups by availability and identity comfort, with an instructor approval gate and strict privacy invariants."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "httpx2"]
web = ["fastapi", "uvicorn[standard]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reflectool_web = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
